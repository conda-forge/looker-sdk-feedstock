schema_version: 1

context:
  name: looker-sdk
  version: "26.24.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/looker_sdk-${{ version }}.tar.gz
  sha256: e78656e11eea86e89b7312888161cf4c1148bb023ce5111cf5f3344d47abbed0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - requests >=2.22
    - typing_extensions >=4.1.1
    - attrs >=20.1.0
    - cattrs >=1.3

tests:
  - python:
      imports:
        - looker_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Looker REST API
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.python.org/pypi/looker_sdk
  repository: https://github.com/looker-open-source/sdk-codegen/tree/main/python

extra:
  recipe-maintainers:
    - xylar
