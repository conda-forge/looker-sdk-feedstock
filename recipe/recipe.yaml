schema_version: 1

context:
  name: looker-sdk
  version: "26.6.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/looker_sdk-${{ version }}.tar.gz
  sha256: caba0212a8b0d1d7d3e2ed21102c52b2398ed0eb6a899d1bcb2dac1d99b753f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - attrs >=20.1.0
    - cattrs >=1.3
    - requests >=2.22
    - typing_extensions >=4.1.1

tests:
  - python:
      imports:
        - looker_sdk
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Looker REST API
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.python.org/pypi/looker_sdk
  repository: https://github.com/looker-open-source/sdk-codegen/tree/main/python

extra:
  recipe-maintainers:
    - xylar
